<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Audio Downloads</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Roboto", Arial, sans-serif;
    }

    body {
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 2rem;
      color: #90caf9;
    }

    .button-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    a.download-btn {
      display: inline-block;
      padding: 1rem 2rem;
      background-color: #1e88e5;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 500;
      transition: background 0.2s, transform 0.1s;
    }

    a.download-btn:hover {
      background-color: #1565c0;
      transform: translateY(-2px);
    }

    a.download-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <h1>Download the Paris Files</h1>
  <div class="button-container">
    <a class="download-btn" href="track1.mp3" download>Download Track 1</a>
    <a class="download-btn" href="track2.mp3" download>Download Track 2</a>
    <a class="download-btn" href="track3.mp3" download>Download Track 3</a>
    <a class="download-btn" href="track4.mp3" download>Download Track 4</a>
  </div>
</body>
</html>
